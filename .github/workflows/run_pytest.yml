name: Run Pytest Automation

on:
  push:
    branches:
      - main

jobs:
  run-tests:
    timeout-minutes: 840

    strategy:
      matrix:
        runner_label: [banjo, sonic, mario]
    
    runs-on: ${{matrix.runner_label}}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show runner info
        shell: cmd
        run: |
          echo Runner Name: %RUNNER_NAME%
          echo DEVICE_KEY: %DEVICE_KEY%

      - name: Update JSON based on runner
        shell: cmd
        run: |
          python utils/update_device_data.py

      - name: Run pytest and save report
        shell: cmd
        run: |
          set mydate=%date:~-4%-%date:~4,2%-%date:~7,2%
          set filename=report_%RUNNER_NAME%_%mydate%.html

          if not exist C:\Users\Testing\Documents\runner_reports mkdir C:\Users\Testing\Documents\runner_reports

          pytest tests/test_silence_detection.py --html=C:\Users\TestingDocuments\runner_reports\%filename% --self-contained-html









