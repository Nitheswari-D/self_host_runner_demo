name: Run Pytest Automation

on:
  push:
    branches:
      - main

jobs:
  run-tests:

    runs-on: [self-hosted, runner_1]

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show runner workspace
        shell: cmd
        run: |
          echo Current workspace location:
          echo %GITHUB_WORKSPACE%
          dir

      - name: Run pytest
        shell: cmd
        run: |
          pytest -v --html=report.html --self-contained-html